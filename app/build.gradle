plugins {
    id 'com.android.application'
}

def versionMajor = 0
def versionMinor = 2
def versionPatch = 0
def appVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch

def resolveGitCommitHash = {
    String commitHash = System.getenv('GITHUB_SHA')
    if (commitHash) {
        return commitHash.take(8)
    }

    try {
        def output = providers.exec {
            workingDir rootDir
            commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        if (output) {
            return output
        }
    } catch (Exception ignored) {
    }

    try {
        File gitDir = new File(rootDir, '.git')
        File headFile = new File(gitDir, 'HEAD')
        String head = headFile.text.trim()
        if (!head.startsWith('ref: ')) {
            return head.take(8)
        }
        File refFile = new File(gitDir, head.substring(5))
        if (refFile.isFile()) {
            return refFile.text.trim().take(8)
        }
    } catch (Exception ignored) {
    }

    return 'unknown'
}

def gitCommitHash = resolveGitCommitHash()
def appVersionName = "${versionMajor}.${versionMinor}.${versionPatch}+${gitCommitHash}"

android {
    namespace 'moe.frisk.myhooks'
    compileSdk 35

    defaultConfig {
        applicationId 'moe.frisk.myhooks'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.luckypray:dexkit:2.0.7'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
